{% extends 'base.html' %}

{% block body %}
    <div class="container">
        <br><br>
        <div class="row center">
            <h3>
                Site for data management in the BIF group.
            </h3>
        </div>

        {% if current_user.is_anonymous %}
            <div class="row center">
                <a href="{{ url_for('auth.test_login') }}"><button class="btn-large waves-effect waves-light green">Log in</button></a>
            </div>
        {% else %}
            <div class="row center">
                <a href="{{ url_for('project.new') }}"><button class="btn-large waves-effect waves-light green">Create a new project</button></a>
            </div>
            <div class="row center">
                <a href="{{ url_for('project.list') }}"><button class="btn-large waves-effect waves-light blue">List your projects</button></a>
            </div>
            <div class="row center">
                <a href="{{ url_for('board.overview') }}"><button class="btn-large waves-effect waves-light blue">Show the project board</button></a>
            </div>
        {% endif %}
        
    </div>
{% endblock %}
